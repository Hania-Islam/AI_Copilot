<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - AI Security Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center shadow-xl">

            <!-- Success Icon -->
            <div class="w-16 h-16 mx-auto rounded-full bg-green-500/10 border border-green-500/20 flex items-center justify-center">
                <i data-lucide="check"
                    class="w-8 h-8 text-green-400">
                </i>
            </div>

            <!-- Heading -->
            <h1 class="text-white text-2xl font-semibold mt-6">
                You have been logged out
            </h1>

            <p class="text-slate-400 text-sm mt-2">
                Your session has ended successfully.
            </p>

            <!-- Status -->
            <div class="mt-6 px-4 py-3 rounded-lg bg-slate-800/60 border border-slate-700">
                <div class="flex items-center justify-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-400"></span>
                    <span class="text-slate-300 text-xs">
                        Logout successful
                    </span>
                </div>
            </div>
        </div>
        <p class="text-center text-slate-600 text-xs mt-5">
            AI Security Copilot
        </p>

    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

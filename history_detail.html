<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950">
    <div class="p-6 lg:p-8">
        <!-- BACK BUTTON -->
        <button id="backToHistory" class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition mb-6">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to History
        </button>

        <!-- FILE HEADER -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6">
            <div class="flex items-start justify-between gap-4">
                
                <div>
                    <div class="flex items-center gap-3">
                        <div id="fileIcon" class="w-10 h-10 rounded-lg flex items-center justify-center"></div>

                        <div>
                            <h1 id="fileName" class="text-xl font-semibold text-slate-900 dark:text-white"></h1>

                            <p id="uploadTime" class="text-xs text-slate-500 mt-1"></p>
                        </div>
                    </div>
                </div>

                <!-- STATUS -->
                <span id="fileStatus" class="inline-flex items-center px-2.5 py-1 rounded-md bg-green-500/10 text-green-600 dark:text-green-400 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>
                </span>
            </div>

            <!-- SUMMARY -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4">
                    <p class="text-xs text-slate-500">
                        File Type
                    </p>

                    <p id="fileType" class="text-lg font-semibold text-slate-900 dark:text-white mt-1"></p>
                </div>

                <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4">
                    <p class="text-xs text-slate-500">
                        Findings
                    </p>

                    <p id="findingsCount" class="text-lg font-semibold text-slate-900 dark:text-white mt-1"> </p>
                </div>


                <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4">
                    <p class="text-xs text-slate-500">
                        Risk Score
                    </p>
                
                    <div class="flex items-center gap-3 mt-2">
                        <div class="relative w-12 h-12">
                            <svg class="w-12 h-12 -rotate-90" viewBox="0 0 36 36">
                                <!-- Background circle -->
                                <circle
                                    cx="18"
                                    cy="18"
                                    r="15"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="3"
                                    class="text-slate-200 dark:text-slate-700"
                                />
                
                                <!-- Risk circle -->
                                <circle
                                    id="riskCircle"
                                    cx="18"
                                    cy="18"
                                    r="15"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="3"
                                    stroke-linecap="round"
                                    class=""
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="94.25"
                                />
                
                            </svg>
                
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span
                                    id="riskScore"
                                    class="text-[10px] font-semibold text-slate-900 dark:text-white">
                                </span>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500">
                            / 100
                        </span>
                    </div>
                </div>


                <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-4">
                    <p class="text-xs text-slate-500">
                        Critical
                    </p>

                    <p id="criticalCount" class="text-lg font-semibold text-red-500 mt-1"> </p>
                </div>
            </div>
        </div>

        <!-- FINDINGS WILL GO HERE LATER -->
        <div id="findingsContainer" class="mt-6"></div>
    </div>

    <script src="js/history_details.js"></script>
</body>
</html>

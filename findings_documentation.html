<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Finding Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="font-[Inter] bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

        <!-- Back button -->
        <button
            id="backToRemediation"
            class="inline-flex items-center gap-2 text-sm font-medium text-blue-500 hover:text-blue-600 dark:hover:text-blue-400 mb-6 transition-colors">
            ← Back to AI Remediation
        </button>

        <!-- Title -->
        <h1
            id="documentationTitle"
            class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white mb-2">
            Loading Documentation...
        </h1>

        <!-- Documentation content -->
        <div
            id="documentationContent"
            class="mt-6 bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/50 rounded-xl p-6 shadow-sm">
            <div id="documentationDescription"></div>
            <div id="documentationImpact" class="mt-6"></div>
            <div id="documentationPrevention" class="mt-6"></div>
            <div id="documentationReferences" class="mt-6"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/Documentation.js"></script>
</body>
</html>
